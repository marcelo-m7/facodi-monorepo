name: Build FACODI Odoo image

on:
  workflow_call:
    inputs:
      project_id:
        required: true
        type: string
      region:
        required: true
        type: string
      artifact_repository:
        required: true
        type: string
      image_name:
        required: true
        type: string
      image_tag:
        required: true
        type: string
      workload_identity_provider:
        required: true
        type: string
      service_account:
        required: true
        type: string
    outputs:
      image_uri:
        description: Immutable Artifact Registry image URI
        value: ${{ jobs.build.outputs.image_uri }}

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image_uri: ${{ steps.image.outputs.uri }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate repository contract
        run: bash scripts/validate-repository.sh

      - id: auth
        name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ inputs.workload_identity_provider }}
          service_account: ${{ inputs.service_account }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ inputs.region }}-docker.pkg.dev" --quiet

      - id: image
        name: Resolve immutable image URI
        shell: bash
        run: |
          uri="${{ inputs.region }}-docker.pkg.dev/${{ inputs.project_id }}/${{ inputs.artifact_repository }}/${{ inputs.image_name }}:${{ inputs.image_tag }}"
          echo "uri=$uri" >> "$GITHUB_OUTPUT"
          echo "Building $uri"

      - name: Build and push image
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: bash scripts/build-image.sh "${{ steps.image.outputs.uri }}" --push
