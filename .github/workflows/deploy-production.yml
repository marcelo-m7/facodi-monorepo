name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: facodi-production
  cancel-in-progress: false

jobs:
  build:
    if: ${{ vars.DEPLOY_PRODUCTION_ENABLED == 'true' }}
    uses: ./.github/workflows/build-image.yml
    with:
      project_id: ${{ vars.GCP_PROJECT_ID }}
      region: ${{ vars.GCP_REGION }}
      artifact_repository: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
      image_name: ${{ vars.FACODI_IMAGE_NAME }}
      image_tag: ${{ github.sha }}
      workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      service_account: ${{ vars.GCP_GITHUB_SERVICE_ACCOUNT }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_GITHUB_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Prepare deployment directory
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          VM_NAME: ${{ vars.PRODUCTION_VM_NAME }}
          VM_ZONE: ${{ vars.PRODUCTION_VM_ZONE }}
          DEPLOY_PATH: ${{ vars.PRODUCTION_DEPLOY_PATH }}
        run: |
          gcloud compute ssh "$VM_NAME" \
            --project "$PROJECT_ID" \
            --zone "$VM_ZONE" \
            --quiet \
            --command "mkdir -p '$DEPLOY_PATH/infrastructure' '$DEPLOY_PATH/scripts'"

      - name: Copy runtime definition to VM
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          VM_NAME: ${{ vars.PRODUCTION_VM_NAME }}
          VM_ZONE: ${{ vars.PRODUCTION_VM_ZONE }}
          DEPLOY_PATH: ${{ vars.PRODUCTION_DEPLOY_PATH }}
        run: |
          gcloud compute scp infrastructure/docker-compose.yml \
            "$VM_NAME:$DEPLOY_PATH/infrastructure/docker-compose.yml" \
            --project "$PROJECT_ID" --zone "$VM_ZONE" --quiet
          gcloud compute scp scripts/deploy-image.sh scripts/healthcheck.sh \
            "$VM_NAME:$DEPLOY_PATH/scripts/" \
            --project "$PROJECT_ID" --zone "$VM_ZONE" --quiet

      - name: Deploy immutable image
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          VM_NAME: ${{ vars.PRODUCTION_VM_NAME }}
          VM_ZONE: ${{ vars.PRODUCTION_VM_ZONE }}
          DEPLOY_PATH: ${{ vars.PRODUCTION_DEPLOY_PATH }}
          IMAGE_URI: ${{ needs.build.outputs.image_uri }}
        run: |
          gcloud compute ssh "$VM_NAME" \
            --project "$PROJECT_ID" \
            --zone "$VM_ZONE" \
            --quiet \
            --command "cd '$DEPLOY_PATH' && chmod +x scripts/deploy-image.sh scripts/healthcheck.sh && bash scripts/deploy-image.sh '$IMAGE_URI'"
