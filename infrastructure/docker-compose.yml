name: facodi

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ODOO_DB:-facodi}
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo} -d ${ODOO_DB:-facodi}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  odoo:
    image: ${FACODI_IMAGE:-facodi-odoo:local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      PORT: 5432
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      ODOO_ADMIN_PASSWD: ${ODOO_ADMIN_PASSWD:?ODOO_ADMIN_PASSWD is required}
    command:
      - --proxy-mode
      - --workers=${ODOO_WORKERS:-2}
      - --max-cron-threads=${ODOO_MAX_CRON_THREADS:-1}
      - --gevent-port=8072
    volumes:
      - odoo-data:/var/lib/odoo
    ports:
      - "127.0.0.1:${ODOO_PORT:-8069}:8069"
      - "127.0.0.1:${ODOO_GEVENT_PORT:-8072}:8072"
    networks:
      - backend

volumes:
  postgres-data:
  odoo-data:

networks:
  backend:
    driver: bridge
